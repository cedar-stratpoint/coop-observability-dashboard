name: Mirror to GitLab

# One-way mirror of this repo's branches and tags to the GitLab copy.
# GitLab Free can't pull-mirror, so GitHub pushes. GitHub is the source of truth:
# --force overwrites GitLab and --prune deletes branches/tags that are gone here. Don't commit on GitLab.
# Setup: repo secret GITLAB_MIRROR_TOKEN (GitLab project access token, Maintainer, write_repository)
# and repo variable GITLAB_MIRROR_URL (https://.../<group>/<project>.git, no credentials).

on:
  push:
  delete:
  schedule:
    - cron: '17 * * * *' # hourly safety net for anything the event triggers miss
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false # let the running push finish; the queued run then pushes the newest state

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch branches and tags from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -q --bare repo.git
          # Only heads and tags: refs/pull/* would be rejected by GitLab and isn't needed.
          git -C repo.git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Branches: $(git -C repo.git for-each-ref refs/heads | wc -l)  Tags: $(git -C repo.git for-each-ref refs/tags | wc -l)"

      - name: Push to GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          URL: ${{ vars.GITLAB_MIRROR_URL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$URL" ]; then echo "::error::GITLAB_MIRROR_TOKEN or GITLAB_MIRROR_URL not set"; exit 1; fi
          git -C repo.git push --prune --force "https://oauth2:${TOKEN}@${URL#https://}" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: Alert Google Chat on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.GCHAT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "GCHAT_WEBHOOK_URL not set; skipping"; exit 0; fi
          jq -n --arg t "⚠️ *GitLab mirror failed* $REPO
          Check the GitLab token (it may have expired) and the protected-branch settings.
          <$RUN_URL|Workflow run>" '{text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json; charset=UTF-8" -d @- "$WEBHOOK"
