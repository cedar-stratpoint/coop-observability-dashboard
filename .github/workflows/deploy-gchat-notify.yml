name: Deploy notify (Google Chat)

on:
  deployment_status

jobs:
  notify:
    # Vercel reports each deploy to GitHub as a deployment status. The environment name carries the Vercel project as a suffix
    # ("Production – coop-observability-dashboard"), and a Preview deploy reports the commit SHA (not the branch name) as its ref,
    # so the environment is worked out in the first step instead of matched exactly here.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Work out the environment
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
          VERCEL_ENV: ${{ github.event.deployment.environment }}
          PROJECT: ${{ github.event.repository.name }}
        run: |
          # Only this repo's own Vercel project notifies ("Production – <repo name>"). Another Vercel project connected to the same
          # repo (for example the old coop-brand-os) reports "<Environment> – <its own name>" and is skipped here, so there is one
          # message per deploy and it links to the right site. A name with no project suffix at all is accepted.
          case "$VERCEL_ENV" in
            *" – "*) case "$VERCEL_ENV" in *" – $PROJECT") ;; *) echo "name=" >> "$GITHUB_OUTPUT"; exit 0 ;; esac ;;
          esac
          # Production* = main. Staging* = a custom Vercel environment named Staging, or the Preview deploy of the staging branch head.
          # Any other Preview (a pull request's deploy) does not notify.
          case "$VERCEL_ENV" in
            Production*) echo "name=Production" >> "$GITHUB_OUTPUT" ;;
            Staging*) echo "name=Staging" >> "$GITHUB_OUTPUT" ;;
            Preview*)
              STAGING_HEAD=$(gh api "repos/$REPO/branches/staging" --jq .commit.sha 2>/dev/null || true)
              if [ -n "$STAGING_HEAD" ] && [ "$STAGING_HEAD" = "$SHA" ]; then echo "name=Staging" >> "$GITHUB_OUTPUT"; else echo "name=" >> "$GITHUB_OUTPUT"; fi ;;
            *) echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post to Google Chat
        if: steps.env.outputs.name != ''
        env:
          WEBHOOK: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          SHA: ${{ github.event.deployment.sha }}
          LIVE_URL: ${{ github.event.deployment_status.environment_url }}
          LOG_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "GCHAT_WEBHOOK_URL not set; skipping"; exit 0; fi
          SUBJECT=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
          jq -n --arg t "🚀 *Deployed to $ENVIRONMENT* $REPO
          $SUBJECT (\`${SHA:0:7}\`)
          <${LIVE_URL:-$LOG_URL}|Open the site> · <$LOG_URL|Deployment>" '{text: $t}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json; charset=UTF-8" -d @- "$WEBHOOK"
